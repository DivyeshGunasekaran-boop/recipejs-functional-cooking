<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeJS - Your Functional Cooking Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>RecipeJS</h1>
        <p>Your Functional Cooking Companion</p>
    </header>

    <main>
    <div class="controls">
    <div class="sort-group">
        <h4>Sort By:</h4>
        <button id="sort-alpha">A-Z</button>
        <button id="sort-time">Time</button>
    </div>

    <hr>

    <div class="filter-group">
        <h4>Filter By:</h4>
        <button id="filter-all">All Recipes</button>
        <button id="filter-easy">Easy</button>
        <button id="filter-medium">Medium</button>
        <button id="filter-hard">Hard</button>
        <button id="filter-quick">Quick (Under 30m)</button>
    </div>
</div>

<div id="recipe-container"></div>
            

    <script src="app.js"></script>
</body>
</html>
